    <!-- Script to update meta tags based on selected language -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function updateMetaTags() {
                const lang = new URLSearchParams(window.location.search).get('lang') || 
                             localStorage.getItem('solarSystemLanguage') || 'en';
                
                // Set document language
                document.documentElement.lang = lang.startsWith('tzm') ? 'ber' : lang;
                
                // Update meta tags based on language
                if (lang === 'fr') {
                    document.title = 'Simulation du Système Solaire';
                } else if (lang === 'ar') {
                    document.title = 'محاكاة النظام الشمسي';
                    document.documentElement.dir = 'rtl';
                } else if (lang === 'tzm') {
                    document.title = 'ⴰⵙⵏⵖⵎⴰⵙ ⵏ ⵓⵙⵏⴳⵍⴰⵍ ⴰⵜⴰⴼⵓⴽⵜ';
                } else if (lang === 'tzm_lat') {
                    document.title = 'Asnɣmas n usnglal atafukt';
                } else {
                    document.title = 'Solar System Simulation';
                    document.documentElement.dir = 'ltr';
                }
            }
            
            updateMetaTags();
            
            // Update meta tags when language is changed
            window.addEventListener('languageChange', updateMetaTags);
        });
    </script>
